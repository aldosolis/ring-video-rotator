<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Simplified icon (16px and 32px toolbar sizes): bolder strokes, skull reduced to a dot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2AAAE6"/>
      <stop offset="1" stop-color="#1285C2"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="url(#bg)"/>

  <!-- Ring -->
  <circle cx="52" cy="82" r="24" fill="none" stroke="#fff" stroke-width="16"/>

  <!-- Flag pole -->
  <line x1="52" y1="14" x2="52" y2="60" stroke="#fff" stroke-width="10" stroke-linecap="round"/>

  <!-- Waving flag with a white skull dot -->
  <path d="M52 16 C 68 8, 88 26, 112 16 L 112 56 C 88 66, 68 48, 52 56 Z" fill="#151515"/>
  <circle cx="82" cy="37" r="10" fill="#fff"/>
</svg>
